<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gui Editor – Autorização</title></head>
<body style="font-family:Arial;max-width:720px;margin:40px auto;padding:0 20px">
<h1>Gui Editor</h1>
<p id="msg">Concluindo a autorização…</p>
<div id="manual" style="display:none">
<p>Se o Claude Code não recebeu automaticamente, copie o código abaixo e cole no terminal:</p>
<textarea id="code" rows="3" style="width:100%" readonly></textarea>
<p><button onclick="navigator.clipboard.writeText(document.getElementById('code').value)">Copiar código</button></p>
</div>
<script>
var q = new URLSearchParams(location.search);
if (q.get('error')) {
  document.getElementById('msg').textContent = 'A autorização não foi concluída: ' + (q.get('error_description') || q.get('error'));
} else if (q.get('code')) {
  document.getElementById('code').value = q.get('code');
  document.getElementById('manual').style.display = 'block';
  document.getElementById('msg').textContent = 'Autorização recebida. Enviando para o Claude Code no seu computador…';
  setTimeout(function(){ location.href = 'http://localhost:8765/callback' + location.search; }, 1500);
} else {
  document.getElementById('msg').textContent = 'Nenhum código de autorização encontrado nesta página.';
}
</script>
</body></html>
